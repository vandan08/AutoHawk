[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autohawk"
version = "0.2.0"
description = "Job aggregation, AI fit-scoring, and cover-letter tailoring pipeline — one place for your whole job hunt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vandan Sheth" }]
dependencies = [
    "anthropic>=0.116.0",
    "requests>=2.31",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autohawk = "autohawk.cli:app"

[tool.setuptools.packages.find]
include = ["autohawk*"]
